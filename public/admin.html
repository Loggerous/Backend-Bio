<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { margin-bottom: 8px; font-size: 1.6rem; }
    .subtitle { color: #888; margin-bottom: 28px; font-size: 0.95rem; }
    label {
      display: block;
      margin: 18px 0 6px;
      font-size: 0.85rem;
      color: #aaa;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #161616;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    .hidden { display: none !important; }
    #error { color: #f87171; margin-top: 12px; min-height: 20px; }
    #status { margin-top: 14px; color: #4ade80; min-height: 20px; }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 28px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Вход -->
    <div id="login" class="card">
      <h1>Вход в админку</h1>
      <p class="subtitle">Пароль по умолчанию: <b>admin123</b></p>
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
      <button onclick="login()">Войти</button>
      <p id="error"></p>
    </div>

    <!-- Панель -->
    <div id="panel" class="card hidden">
      <h1>Редактор сайта</h1>
      <p class="subtitle">Изменения сразу видны всем посетителям</p>

      <label>Имя</label>
      <input id="name">

      <label>Заголовок / должность</label>
      <input id="title">

      <label>Краткое описание</label>
      <textarea id="tagline" rows="2"></textarea>

      <label>Город</label>
      <input id="city">

      <label>Возраст</label>
      <input id="age">

      <label>Опыт</label>
      <input id="exp">

      <label>Статус</label>
      <input id="status">

      <label>URL аватара</label>
      <input id="avatar">

      <label>Email</label>
      <input id="email">

      <label>Режим (normal / compact)</label>
      <input id="mode" placeholder="compact">

      <label>Discord (ссылка или ID)</label>
      <input id="discordId">

      <label>URL музыки</label>
      <input id="musicUrl">

      <label>Название трека</label>
      <input id="musicTitle">

      <label>Обложка музыки</label>
      <input id="musicAvatar">

      <label>Новый пароль для админки (оставь пустым, чтобы не менять)</label>
      <input type="password" id="newPassword" placeholder="Новый пароль">

      <button onclick="save()">Сохранить для всех</button>
      <p id="status"></p>
    </div>

  </div>

  <script>
    async function login() {
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ password })
      });

      if (res.ok) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        loadConfig();
      } else {
        document.getElementById('error').textContent = 'Неверный пароль';
      }
    }

    async function loadConfig() {
      const res = await fetch('/api/config');
      const cfg = await res.json();

      document.getElementById('name').value = cfg.name || '';
      document.getElementById('title').value = cfg.title || '';
      document.getElementById('tagline').value = cfg.tagline || '';
      document.getElementById('city').value = cfg.city || '';
      document.getElementById('age').value = cfg.age || '';
      document.getElementById('exp').value = cfg.exp || '';
      document.getElementById('status').value = cfg.status || '';
      document.getElementById('avatar').value = cfg.avatar || '';
      document.getElementById('email').value = cfg.email || '';
      document.getElementById('mode').value = cfg.mode || 'compact';
      document.getElementById('discordId').value = cfg.discordId || '';
      document.getElementById('musicUrl').value = cfg.musicUrl || '';
      document.getElementById('musicTitle').value = cfg.musicTitle || '';
      document.getElementById('musicAvatar').value = cfg.musicAvatar || '';
    }

    async function save() {
      const current = await (await fetch('/api/config')).json();

      const body = {
        ...current,
        name: document.getElementById('name').value,
        title: document.getElementById('title').value,
        tagline: document.getElementById('tagline').value,
        city: document.getElementById('city').value,
        age: document.getElementById('age').value,
        exp: document.getElementById('exp').value,
        status: document.getElementById('status').value,
        avatar: document.getElementById('avatar').value,
        email: document.getElementById('email').value,
        mode: document.getElementById('mode').value || 'compact',
        discordId: document.getElementById('discordId').value,
        musicUrl: document.getElementById('musicUrl').value,
        musicTitle: document.getElementById('musicTitle').value,
        musicAvatar: document.getElementById('musicAvatar').value
      };

      const newPass = document.getElementById('newPassword').value.trim();
      if (newPass) {
        body.adminPassword = newPass;
      }

      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body)
      });

      const status = document.getElementById('status');
      if (res.ok) {
        status.textContent = 'Сохранено! Обнови страницу сайта.';
        document.getElementById('newPassword').value = '';
      } else {
        status.textContent = 'Ошибка сохранения';
        status.style.color = '#f87171';
      }
    }

    // Enter для входа
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
